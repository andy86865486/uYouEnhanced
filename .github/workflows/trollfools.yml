name: Generate TrollFools files

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK version"
        required: true
        default: "18.6"
        type: string
      uyou_version:
        description: "uYou version"
        required: true
        default: "3.0.4"
        type: string
      ytuhd:
        description: "Include YTUHD"
        required: true
        default: false
        type: boolean
      sponsorblock:
        description: "Include iSponsorBlock"
        required: true
        default: false
        type: boolean
      create_release:
        description: "Create a draft release with a direct ZIP download"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: trollfools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build uYouEnhanced for TrollFools
    runs-on: macos-latest

    steps:
      - name: Checkout uYouEnhanced
        uses: actions/checkout@v7
        with:
          path: main
          submodules: recursive

      - name: Install build dependencies
        run: brew install ldid dpkg make

      - name: Configure Theos
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Install Theos
        uses: actions/checkout@v7
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Cache iOS SDK
        id: sdk
        uses: actions/cache@v6
        with:
          path: theos/sdks/
          key: iOS-${{ inputs.sdk_version }}-SDK

      - name: Download iOS SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/aricloverALT/sdks/ sdks
          cd sdks
          git sparse-checkout set --no-cone "iPhoneOS${{ inputs.sdk_version }}.sdk"
          git checkout --quiet
          set -euo pipefail
          git clone --quiet --depth=1 --filter=blob:none --sparse \
            https://github.com/xybp888/iOS-SDKs.git sdks
          git -C sdks sparse-checkout set "iPhoneOS${{ inputs.sdk_version }}.sdk"
          sdk_path="sdks/iPhoneOS${{ inputs.sdk_version }}.sdk"
          if [ ! -d "$sdk_path" ]; then
            echo "Requested SDK was not found: $sdk_path" >&2
            echo 'Available SDK folders:' >&2
            git -C sdks ls-tree --name-only HEAD 'iPhoneOS*.sdk' >&2
            exit 1
          fi
          mkdir -p "$THEOS/sdks"
          mv *.sdk "$THEOS/sdks/"
          cp -R "$sdk_path" "$THEOS/sdks/"

      - name: Install Theos Jailed module
        uses: actions/checkout@v7
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed

      - name: Set up Theos Jailed
        run: ./theos-jailed/install
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Patch Theos broken-pipe scripts
        run: |
          find "$THEOS" -name '*.sh' -type f | while read -r script; do
            if grep -q '| head' "$script" 2>/dev/null; then
              sed -i '' 's/| head/2>\/dev\/null | head/g' "$script" 2>/dev/null || true
            fi
          done
          find "$THEOS" -name '*.mk' -type f | while read -r makefile; do
            if grep -q '| head' "$makefile" 2>/dev/null; then
              sed -i '' 's/| head/2>\/dev\/null | head/g' "$makefile" 2>/dev/null || true
            fi
          done

      - name: Build uYouEnhanced and its subprojects
        working-directory: main
        env:
          THEOS: ${{ github.workspace }}/theos
          UYOU_VERSION: ${{ inputs.uyou_version }}
        run: |
          set -euo pipefail
          make all \
            FINALPACKAGE=1 \
            SDK_VERSION='${{ inputs.sdk_version }}' \
            YTUHD_ENABLED=${{ inputs.ytuhd && '1' || '0' }} \
            SPONSORBLOCK_ENABLED=${{ inputs.sponsorblock && '1' || '0' }}

      - name: Package TrollFools ZIP
        id: package
        working-directory: main
        run: |
          set -euo pipefail
          objdirs=()
          while IFS= read -r -d '' objdir; do
            objdirs+=("$objdir")
          done < <(find . -type d -name obj \
            -not -path './.git/*' \
            -not -path './theos/*' \
            -print0)
          if [ "${#objdirs[@]}" -eq 0 ]; then
            echo 'No Theos build output directories were found.' >&2
            exit 1
          fi
          output="uYouEnhanced_TrollFools_${{ inputs.uyou_version }}.zip"
          python3 Scripts/package_trollfools.py \
            --roots "${objdirs[@]}" \
            Bundles Localizations/uYouPlus.bundle Tweaks/uYou \
            --output "$output"
          echo "output=$output" >> "$GITHUB_OUTPUT"

      - name: Check plugin dependencies
        working-directory: main
        run: |
          set -euo pipefail
          mkdir -p dependency-check
          unzip -q "${{ steps.package.outputs.output }}" -d dependency-check
          : > dependencies.txt
          while IFS= read -r -d '' binary; do
            if file "$binary" | grep -q 'Mach-O'; then
              otool -L "$binary" >> dependencies.txt
            fi
          done < <(find dependency-check -type f -print0)
          cat dependencies.txt
          if grep -Eq '\.jbroot|/var/jb|libroothide' dependencies.txt; then
            echo 'Jailbreak-bootstrap dependency detected in a plugin binary.' >&2
            exit 1
          fi

      - name: Upload TrollFools ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: uYouEnhanced-TrollFools
          path: main/${{ steps.package.outputs.output }}
          if-no-files-found: error
          retention-days: 14

      - name: Create draft release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: uyou-trollfools-${{ github.run_number }}
          name: uYouEnhanced TrollFools ${{ inputs.uyou_version }} (${{ github.run_number }})
          files: main/${{ steps.package.outputs.output }}
          draft: true
